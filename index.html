<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Iron Log</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#17181A;
    --paper:#F6F5F2;
    --paper-dim:#ECEAE4;
    --muted:#8A887F;
    --muted-dark:#65635B;
    --accent:#BD5B2C;
    --card:#FFFFFF;
    --line:#E7E3DA;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--ink);}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color:var(--ink);
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .screen{
    flex:1;
    padding:calc(env(safe-area-inset-top) + 22px) 18px 100px 18px;
    overflow-y:auto;
  }
  h1,h2,h3{margin:0; font-weight:700; letter-spacing:-0.02em;}
  h2{font-size:26px; margin-bottom:4px;}
  .brand{
    font-size:22px;
    letter-spacing:-0.02em;
    font-weight:800;
    color:var(--ink);
    margin-bottom:2px;
  }
  .brand span{color:var(--accent);}
  .subhead{
    font-size:13.5px;
    color:var(--muted);
    margin-bottom:24px;
  }
  .stat-num{
    font-weight:700;
    letter-spacing:-0.02em;
    font-variant-numeric: tabular-nums;
  }
  .card{
    background:var(--card);
    border-radius:16px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 1px 2px rgba(23,24,26,0.04), 0 6px 16px rgba(23,24,26,0.045);
  }
  .card-title{
    font-size:13px;
    color:var(--muted);
    margin-bottom:12px;
    font-weight:600;
  }
  .hero-num{
    font-size:42px;
    line-height:1;
  }
  .hero-row{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .unit{
    font-size:14px;
    color:var(--muted);
    font-weight:600;
  }
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .grid3{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
  }
  input[type=number], input[type=text], input[type=date], select, textarea{
    width:100%;
    padding:12px 13px;
    border:1px solid var(--line);
    border-radius:11px;
    font-size:16px;
    background:var(--paper);
    color:var(--ink);
    font-family:inherit;
  }
  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--muted-dark);
  }
  label.field-label{
    font-size:12px;
    color:var(--muted);
    font-weight:600;
    display:block;
    margin-bottom:6px;
    margin-top:12px;
  }
  label.field-label:first-child{margin-top:0;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
  }
  .btn{
    background:var(--ink);
    color:var(--paper);
    padding:14px 18px;
    border-radius:13px;
    font-size:15px;
    font-weight:600;
    width:100%;
  }
  .btn:active{opacity:0.75;}
  .btn.accent{background:var(--accent); color:#fff;}
  .btn.ghost{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line);
  }
  .btn.sm{padding:9px 14px; font-size:13px; width:auto;}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{flex:1;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    padding:9px 15px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--paper);
    font-size:13.5px;
    font-weight:600;
    color:var(--muted-dark);
  }
  .chip.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  .list-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 0;
    border-bottom:1px solid var(--line);
    font-size:14.5px;
  }
  .list-row:last-child{border-bottom:none;}
  .list-row .meta{color:var(--muted); font-size:12.5px;}
  .bar-track{
    height:8px;
    background:var(--paper-dim);
    border-radius:6px;
    overflow:hidden;
    margin-top:6px;
  }
  .bar-fill{
    height:100%;
    background:var(--ink);
    border-radius:6px;
    transition:width .25s ease;
  }
  .macro-row{margin-bottom:14px;}
  .macro-row:last-child{margin-bottom:0;}
  .macro-label{
    display:flex;
    justify-content:space-between;
    font-size:12.5px;
    color:var(--muted);
    font-weight:600;
  }
  nav.tabbar{
    position:fixed;
    bottom:0;
    left:0; right:0;
    max-width:520px;
    margin:0 auto;
    background:rgba(246,245,242,0.92);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 4px calc(env(safe-area-inset-bottom) + 8px) 4px;
    z-index:50;
  }
  nav.tabbar button{
    flex:1;
    background:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:6px 2px;
    color:var(--muted);
    font-size:10.5px;
    font-weight:600;
  }
  nav.tabbar button.active{color:var(--accent);}
  nav.tabbar .ic{line-height:1; display:flex;}
  nav.tabbar svg{width:22px; height:22px;}
  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(23,24,26,0.5);
    z-index:100;
    display:flex;
    align-items:flex-end;
    max-width:520px;
    margin:0 auto;
  }
  .modal{
    background:var(--paper);
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    border-radius:22px 22px 0 0;
    padding:22px 18px calc(env(safe-area-inset-bottom) + 20px) 18px;
  }
  .modal-handle{
    width:36px; height:4px; background:var(--line); border-radius:3px;
    margin:0 auto 16px auto;
  }
  .close-x{
    position:absolute; top:16px; right:16px;
    font-size:15px; color:var(--muted-dark);
    background:var(--paper-dim);
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .toast{
    position:fixed;
    top:calc(env(safe-area-inset-top) + 14px);
    left:50%; transform:translateX(-50%);
    background:var(--ink);
    color:var(--paper);
    padding:11px 18px;
    border-radius:11px;
    font-size:13.5px;
    font-weight:600;
    max-width:88%;
    z-index:200;
    box-shadow:0 8px 24px rgba(0,0,0,0.22);
  }
  .profile-pick-btn{
    width:100%;
    text-align:left;
    background:var(--card);
    border-radius:18px;
    padding:18px;
    font-size:16px;
    font-weight:600;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 1px 2px rgba(23,24,26,0.04), 0 6px 16px rgba(23,24,26,0.045);
  }
  .profile-pick-btn:active{opacity:0.8;}
  .segmented{
    display:flex;
    background:var(--paper-dim);
    border-radius:11px;
    padding:3px;
    gap:2px;
    margin-bottom:14px;
  }
  .segmented button{
    flex:1;
    padding:8px 4px;
    border-radius:9px;
    font-size:12.5px;
    font-weight:600;
    color:var(--muted-dark);
    background:transparent;
  }
  .segmented button.active{background:var(--card); color:var(--ink);}
  .empty{
    text-align:center;
    padding:30px 10px;
    color:var(--muted);
    font-size:13.5px;
  }
  .divider{height:1px; background:var(--line); margin:16px 0;}
  .food-lib-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 0; border-bottom:1px solid var(--line);
  }
  .food-lib-row:last-child{border-bottom:none;}
  .food-lib-row button{
    background:var(--paper-dim); color:var(--ink);
    border-radius:9px; padding:6px 13px; font-size:12.5px; font-weight:600;
  }
  .link-btn{
    background:none; color:var(--accent); font-weight:600; font-size:13.5px; padding:6px 0;
  }
  .spinner{
    display:inline-block; width:16px; height:16px;
    border:2px solid rgba(255,255,255,0.3);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    vertical-align:middle; margin-right:8px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .scan-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; padding:20px 8px;
    background:var(--card); border:1px solid var(--line);
    border-radius:16px; font-size:12.5px; font-weight:600; color:var(--muted-dark);
    box-shadow:0 1px 2px rgba(23,24,26,0.03);
  }
  .scan-btn svg{width:22px; height:22px; color:var(--ink);}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- icons ---------------- */
function svgIcon(name){
  const icons = {
    today: '<path d="M7 3v3M17 3v3M4 9h16M5 6h14a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"/>',
    weight: '<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 5V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1"/><circle cx="12" cy="13" r="3.2"/><path d="M12 13l1.6-1.6"/>',
    train: '<path d="M4 9v6M20 9v6M2 11v2M22 11v2M7 8v8M17 8v8M7 12h10"/>',
    food: '<path d="M6 3v7a2 2 0 0 0 2 2v9M6 3v9M9 3v9M14 3c-2 2-2 5-2 7 0 1.5 1 2 2 2v9M14 3v18"/>',
    trends: '<path d="M4 19h16M4 15l5-5 4 3 6-7"/><circle cx="4" cy="15" r="1.3" fill="currentColor" stroke="none"/><circle cx="9" cy="10" r="1.3" fill="currentColor" stroke="none"/><circle cx="13" cy="13" r="1.3" fill="currentColor" stroke="none"/><circle cx="19" cy="6" r="1.3" fill="currentColor" stroke="none"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 13.5c.1-.5.1-1 0-1.5l1.9-1.5-2-3.4-2.3.9a7.7 7.7 0 0 0-1.3-.75L15.3 5h-4l-.4 2.25c-.47.2-.9.45-1.3.75l-2.3-.9-2 3.4L7.2 12c-.1.5-.1 1 0 1.5l-1.9 1.5 2 3.4 2.3-.9c.4.3.83.55 1.3.75L11.3 20h4l.4-2.25c.47-.2.9-.45 1.3-.75l2.3.9 2-3.4-1.9-1.5z"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    camera: '<path d="M4 8h3l1.5-2.5h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>',
    barcode: '<path d="M4 5v14M8 5v14M11 5v14M13 5v14M17 5v14M20 5v14"/>'
  };
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${icons[name]||''}</svg>`;
}

/* ---------------- global error safety net ---------------- */
function errText(e){
  if(!e) return 'Unknown error';
  if(e.message) return e.message;
  if(typeof e === 'object'){
    try{ return JSON.stringify(e); }catch(_){ return String(e); }
  }
  return String(e);
}
function showFatalError(prefix, e){
  const banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#9C4A3C;color:#fff;padding:12px 16px;font-size:12px;font-family:monospace;z-index:9999;max-height:45vh;overflow:auto;white-space:pre-wrap';
  banner.textContent = prefix + ': ' + errText(e);
  document.body.appendChild(banner);
}
window.addEventListener('error', function(e){
  showFatalError('Script error', e.error || e.message || e);
});
window.addEventListener('unhandledrejection', function(e){
  showFatalError('Unhandled error', e.reason);
});

/* ---------------- supabase setup ---------------- */
const SUPABASE_URL = 'https://nvitvoccddmunmfzacgd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_qTF5oSAIbEhUAvVWgG7Ayw_JvHbLAqL';
let supabaseClient;
try{
  if(!window.supabase) throw new Error('Supabase library failed to load (check your internet connection and reload).');
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}catch(e){
  document.getElementById('app').innerHTML =
    '<div style="padding:40px 20px;font-family:sans-serif;color:#1B1D21">'
    +'<h2>Couldn\'t start the app</h2><p>'+errText(e)+'</p>'
    +'<p style="color:#8A887F;font-size:13px">Try reloading the page. If this keeps happening, check that your connection is online.</p></div>';
  throw e;
}

/* ---------------- db data layer ---------------- */
async function dbEnsureProfiles(){
  for(const p of PROFILES){
    await supabaseClient.from('profiles').upsert({name:p.name}, {onConflict:'name'});
    const {data} = await supabaseClient.from('settings').select('profile_name').eq('profile_name', p.name).maybeSingle();
    if(!data){
      await supabaseClient.from('settings').insert({profile_name:p.name, ...DEFAULT_SETTINGS_DB});
    }
  }
}
async function dbFetchSettings(name){
  const {data, error} = await supabaseClient.from('settings').select('*').eq('profile_name', name).maybeSingle();
  if(error || !data) return null;
  return {
    calorieTarget: data.calorie_target,
    proteinTarget: data.protein_target,
    carbTarget: data.carb_target,
    fatTarget: data.fat_target,
    weightUnit: data.weight_unit,
    categories: data.categories,
  };
}
async function dbSaveSettings(name, s){
  await supabaseClient.from('settings').update({
    calorie_target: s.calorieTarget,
    protein_target: s.proteinTarget,
    carb_target: s.carbTarget,
    fat_target: s.fatTarget,
    weight_unit: s.weightUnit,
    categories: s.categories,
  }).eq('profile_name', name);
}
async function dbFetchWeightLog(name){
  const {data, error} = await supabaseClient.from('weight_logs').select('date,value').eq('profile_name', name).order('date');
  return error ? [] : data;
}
async function dbUpsertWeight(name, date, value){
  await supabaseClient.from('weight_logs').upsert({profile_name:name, date, value}, {onConflict:'profile_name,date'});
}
async function dbFetchWorkoutLog(name){
  const {data, error} = await supabaseClient.from('workout_logs').select('date,category,note').eq('profile_name', name).order('date');
  return error ? [] : data;
}
async function dbUpsertWorkout(name, date, category, note){
  await supabaseClient.from('workout_logs').upsert({profile_name:name, date, category, note}, {onConflict:'profile_name,date'});
}
async function dbFetchFoodLog(name){
  const {data, error} = await supabaseClient.from('food_items').select('*').eq('profile_name', name).order('date');
  if(error) return [];
  const byDate = {};
  data.forEach(row=>{
    if(!byDate[row.date]) byDate[row.date] = {date:row.date, items:[]};
    byDate[row.date].items.push({
      id:row.id, name:row.name, calories:row.calories, protein:row.protein,
      carbs:row.carbs, fat:row.fat, qty:row.qty
    });
  });
  return Object.values(byDate).sort((a,b)=>a.date.localeCompare(b.date));
}
async function dbInsertFoodItem(name, date, item){
  const {data, error} = await supabaseClient.from('food_items').insert({
    profile_name:name, date, name:item.name, calories:item.calories,
    protein:item.protein, carbs:item.carbs, fat:item.fat, qty:item.qty
  }).select().single();
  return error ? null : data;
}
async function dbDeleteFoodItem(id){
  await supabaseClient.from('food_items').delete().eq('id', id);
}
async function dbFetchFoodLib(name){
  const {data, error} = await supabaseClient.from('food_library').select('*').eq('profile_name', name).order('created_at', {ascending:false});
  if(error) return [];
  return data.map(r=>({
    id:r.id, name:r.name, servingSize:r.serving_size, servingUnit:r.serving_unit,
    calories:r.calories, protein:r.protein, carbs:r.carbs, fat:r.fat
  }));
}
async function dbAddToLibrary(name, food){
  await supabaseClient.from('food_library').insert({
    profile_name:name, name:food.name, serving_size:food.servingSize, serving_unit:food.servingUnit,
    calories:food.calories, protein:food.protein, carbs:food.carbs, fat:food.fat
  });
}

const DEFAULT_SETTINGS_DB = {
  calorie_target:2200, protein_target:150, carb_target:220, fat_target:70,
  weight_unit:'kg', categories:['Push','Pull','Legs','Full Body','Cardio','Rest']
};

const PROFILES = [
  {name:'Nidal', avatar:'boy'},
  {name:'Sajjar', avatar:'girl'},
];

/* ---------------- global state ---------------- */
let STATE = {
  view: 'loading', // loading, pick, today, weight, workouts, food, trends, settings
  activeProfile: null,
  settings: null,
  weightLog: [],
  workoutLog: [],
  foodLog: [],
  foodLib: [],
  weightRange: 30,
  modal: null, // {type:'addWeight'|'addWorkout'|'addFood'|'foodConfirm'|'switchProfile', data:{}}
  toast: null,
  busy: false,
};

const DEFAULT_SETTINGS = {
  calorieTarget: 2200,
  proteinTarget: 150,
  carbTarget: 220,
  fatTarget: 70,
  weightUnit: 'kg',
  categories: ['Push','Pull','Legs','Full Body','Cardio','Rest']
};

function todayStr(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}
function fmtDate(s){
  const d = new Date(s+'T00:00:00');
  return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
}
function showToast(msg){
  STATE.toast = msg;
  render();
  setTimeout(()=>{ STATE.toast = null; render(); }, 2400);
}
function uid(){ return Math.random().toString(36).slice(2,10); }

/* ---------------- profile / bootstrap ---------------- */
async function boot(){
  STATE.view = 'loading';
  render();
  await dbEnsureProfiles();
  STATE.view = 'pick';
  render();
}

async function selectProfile(name){
  STATE.activeProfile = name;
  STATE.view = 'loading';
  render();
  const [settings, weightLog, workoutLog, foodLog, foodLib] = await Promise.all([
    dbFetchSettings(name),
    dbFetchWeightLog(name),
    dbFetchWorkoutLog(name),
    dbFetchFoodLog(name),
    dbFetchFoodLib(name),
  ]);
  STATE.settings = settings || {...DEFAULT_SETTINGS};
  STATE.weightLog = weightLog || [];
  STATE.workoutLog = workoutLog || [];
  STATE.foodLog = foodLog || [];
  STATE.foodLib = foodLib || [];
  STATE.view = 'today';
  render();
}

function switchProfile(){
  STATE.view = 'pick';
  STATE.activeProfile = null;
  render();
}

/* ---------------- data accessors ---------------- */
function foodDayEntry(date){
  return STATE.foodLog.find(d=>d.date===date);
}
function foodDayTotals(date){
  const day = foodDayEntry(date);
  if(!day) return {calories:0,protein:0,carbs:0,fat:0};
  return day.items.reduce((acc,it)=>({
    calories: acc.calories + (it.calories||0),
    protein: acc.protein + (it.protein||0),
    carbs: acc.carbs + (it.carbs||0),
    fat: acc.fat + (it.fat||0),
  }), {calories:0,protein:0,carbs:0,fat:0});
}
function workoutForDate(date){
  return STATE.workoutLog.find(w=>w.date===date);
}
function weightForDate(date){
  return STATE.weightLog.find(w=>w.date===date);
}

/* ---------------- mutations ---------------- */
async function saveWeight(date, value){
  const idx = STATE.weightLog.findIndex(w=>w.date===date);
  if(idx>-1) STATE.weightLog[idx].value = value;
  else STATE.weightLog.push({date, value});
  STATE.weightLog.sort((a,b)=>a.date.localeCompare(b.date));
  await dbUpsertWeight(STATE.activeProfile, date, value);
}
async function saveWorkout(date, category, note){
  const idx = STATE.workoutLog.findIndex(w=>w.date===date);
  if(idx>-1) STATE.workoutLog[idx] = {date, category, note};
  else STATE.workoutLog.push({date, category, note});
  STATE.workoutLog.sort((a,b)=>a.date.localeCompare(b.date));
  await dbUpsertWorkout(STATE.activeProfile, date, category, note);
}
async function addFoodEntry(date, item){
  const saved = await dbInsertFoodItem(STATE.activeProfile, date, item);
  const finalItem = saved ? {
    id:saved.id, name:saved.name, calories:saved.calories, protein:saved.protein,
    carbs:saved.carbs, fat:saved.fat, qty:saved.qty
  } : item;
  let day = foodDayEntry(date);
  if(!day){ day = {date, items:[]}; STATE.foodLog.push(day); }
  day.items.push(finalItem);
  STATE.foodLog.sort((a,b)=>a.date.localeCompare(b.date));
}
async function removeFoodEntry(date, itemId){
  const day = foodDayEntry(date);
  if(day) day.items = day.items.filter(it=>it.id!==itemId);
  await dbDeleteFoodItem(itemId);
}
async function addToLibrary(food){
  food.id = food.id || uid();
  STATE.foodLib.unshift(food);
  await dbAddToLibrary(STATE.activeProfile, food);
}

/* ---------------- vision / AI helpers ---------------- */
async function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function extractText(data){
  try{
    return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  }catch(e){ return ''; }
}
function cleanJson(text){
  const cleaned = text.replace(/```json/gi,'').replace(/```/g,'').trim();
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  if(start===-1||end===-1) throw new Error('no json');
  return JSON.parse(cleaned.slice(start,end+1));
}

async function analyzeLabelPhoto(base64){
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:500,
      messages:[{
        role:'user',
        content:[
          {type:'image', source:{type:'base64', media_type:'image/jpeg', data:base64}},
          {type:'text', text:'This is a photo of a food nutrition facts label. Read it and respond with ONLY minified JSON, no other text, no code fences, in this exact shape: {"name":string or null,"servingSize":number or null,"servingUnit":string or null,"calories":number or null,"protein":number or null,"carbs":number or null,"fat":number or null}. Use grams for protein/carbs/fat. If a value is not visible on the label, use null for it.'}
        ]
      }]
    })
  });
  const data = await resp.json();
  const text = extractText(data);
  return cleanJson(text);
}

async function readBarcodeDigits(base64){
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:100,
      messages:[{
        role:'user',
        content:[
          {type:'image', source:{type:'base64', media_type:'image/jpeg', data:base64}},
          {type:'text', text:'This photo shows a product barcode. Read the numeric UPC/EAN digits printed under or near the barcode lines. Respond with ONLY the digits, nothing else, no spaces. If no clear number is readable, respond with exactly: NONE'}
        ]
      }]
    })
  });
  const data = await resp.json();
  const text = extractText(data).trim();
  if(!text || text.toUpperCase().includes('NONE')) return null;
  const digits = text.replace(/[^0-9]/g,'');
  return digits.length>=6 ? digits : null;
}

async function lookupBarcode(code){
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:600,
      messages:[{
        role:'user',
        content:'Search the web for the food product with barcode/UPC/EAN number '+code+'. Find its name and typical nutrition facts per single serving (calories, protein, carbs, fat, serving size). After searching, respond with ONLY minified JSON as your final line, no code fences: {"name":string or null,"servingSize":number or null,"servingUnit":string or null,"calories":number or null,"protein":number or null,"carbs":number or null,"fat":number or null,"found":true or false}'
      }],
      tools:[{type:'web_search_20250305', name:'web_search'}]
    })
  });
  const data = await resp.json();
  const text = extractText(data);
  return cleanJson(text);
}

function drawWeightChart(){
  const canvas = document.getElementById('weightChart');
  if(!canvas || STATE.weightLog.length<2) return;
  let logs = [...STATE.weightLog].sort((a,b)=>a.date.localeCompare(b.date));
  if(STATE.weightRange>0){
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate()-STATE.weightRange);
    const cutoffStr = cutoff.toISOString().slice(0,10);
    logs = logs.filter(l=>l.date>=cutoffStr);
  }
  const labels = logs.map(l=>fmtDate(l.date));
  const values = logs.map(l=>l.value);
  const trend = values.map((v,i)=>{
    const start = Math.max(0,i-6);
    const slice = values.slice(start,i+1);
    return slice.reduce((a,b)=>a+b,0)/slice.length;
  });
  if(window.__wchart) window.__wchart.destroy();
  window.__wchart = new Chart(canvas.getContext('2d'), {
    type:'line',
    data:{ labels, datasets:[
      {label:'Weight', data:values, borderColor:'#BD5B2C', backgroundColor:'transparent', pointRadius:3, tension:0.25, borderWidth:2},
      {label:'7-day avg', data:trend, borderColor:'#65635B', backgroundColor:'transparent', pointRadius:0, borderWidth:2, borderDash:[5,4], tension:0.3}
    ]},
    options:{
      responsive:true,
      plugins:{legend:{labels:{color:'#17181A', font:{weight:'600', size:11}}}},
      scales:{
        x:{ticks:{color:'#8A887F', font:{size:10}}, grid:{display:false}},
        y:{ticks:{color:'#8A887F', font:{size:10}}, grid:{color:'#E7E3DA'}}
      }
    }
  });
}

    if(!cat){ showToast('Pick a category'); return; }
    const note = document.getElementById('m-workout-note').value;
    await saveWorkout(todayStr(), cat, note);
    STATE.modal=null;
    showToast('Session logged');
    render();
  };

  // add food modal
  function readFoodForm(){
    return {
      name: document.getElementById('f-name').value.trim() || 'Food',
      servingSize: Number(document.getElementById('f-serving').value)||0,
      servingUnit: document.getElementById('f-servingunit').value,
      calories: Number(document.getElementById('f-cal').value)||0,
      protein: Number(document.getElementById('f-pro').value)||0,
      carbs: Number(document.getElementById('f-carb').value)||0,
      fat: Number(document.getElementById('f-fat').value)||0,
      qty: Number(document.getElementById('f-qty').value)||1,
    };
  }
  const fSaveOnce = document.getElementById('f-save-once');
  if(fSaveOnce) fSaveOnce.onclick = async ()=>{
    const f = readFoodForm();
    await addFoodEntry(todayStr(), {
      id:uid(), name:f.name, qty:f.qty,
      calories:f.calories*f.qty, protein:f.protein*f.qty, carbs:f.carbs*f.qty, fat:f.fat*f.qty
    });
    STATE.modal=null;
    showToast('Logged '+f.name);
    render();
  };
  const fSaveLib = document.getElementById('f-save-lib');
  if(fSaveLib) fSaveLib.onclick = async ()=>{
    const f = readFoodForm();
    await addFoodEntry(todayStr(), {
      id:uid(), name:f.name, qty:f.qty,
      calories:f.calories*f.qty, protein:f.protein*f.qty, carbs:f.carbs*f.qty, fat:f.fat*f.qty
    });
    await addToLibrary({
      name:f.name, servingSize:f.servingSize, servingUnit:f.servingUnit,
      calories:f.calories, protein:f.protein, carbs:f.carbs, fat:f.fat
    });
    STATE.modal=null;
    showToast('Logged and saved '+f.name);
    render();
  };

  // scan (label / barcode)
  const scanTrigger = document.getElementById('scan-trigger');
  const scanInput = document.getElementById('scan-input');
  if(scanTrigger && scanInput){
    scanTrigger.onclick = ()=> scanInput.click();
    scanInput.onchange = async ()=>{
      const file = scanInput.files[0];
      if(!file) return;
      STATE.busy = true;
      const statusEl = document.getElementById('scan-status');
      const isBarcode = STATE.modal.type==='scanBarcode';
      try{
        const b64 = await fileToBase64(file);
        if(isBarcode){
          if(statusEl) statusEl.textContent = 'Reading barcode…';
          const code = await readBarcodeDigits(b64);
          if(!code) throw new Error('Could not read a barcode number from that photo. Try again with better lighting, or enter the food manually.');
          if(statusEl) statusEl.textContent = 'Found code '+code+' — searching for the product…';
          const result = await lookupBarcode(code);
          if(!result.found){
            STATE.busy = false;
            STATE.modal = {type:'addFood', data:{sourceNote:'Could not find that barcode online — enter details manually.'}};
            render();
            return;
          }
          STATE.busy = false;
          STATE.modal = {type:'addFood', data:{...result, sourceNote:'Pulled from a web search on barcode '+code+' — double check before saving.'}};
          render();
        } else {
          if(statusEl) statusEl.textContent = 'Reading label…';
          const result = await analyzeLabelPhoto(b64);
          STATE.busy = false;
          STATE.modal = {type:'addFood', data:{...result, sourceNote:'Read from your photo — double check before saving.'}};
          render();
        }
      }catch(err){
        STATE.busy = false;
        STATE.modal = {type:'addFood', data:{sourceNote: (err && err.message) || 'Could not read that photo — enter details manually.'}};
        render();
      }
    };
  }
}

boot().catch(e=>{
  document.getElementById('app').innerHTML =
    '<div style="padding:40px 20px;font-family:sans-serif;color:#1B1D21">'
    +'<h2>Something went wrong loading your data</h2><p>'+errText(e)+'</p>'
    +'<p style="color:#8A887F;font-size:13px">Try reloading the page.</p></div>';
});
</script>
</body>
</html>
