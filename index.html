<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Locked In</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --ink:#F3F1EB;
    --paper:#0F1012;
    --paper-dim:#17181B;
    --muted:#8F8C83;
    --muted-dark:#C9C5BB;
    --accent:#4A6FA5;
    --card:#1D1E21;
    --line:#2C2D30;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--paper);}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color:var(--ink);
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .screen{
    flex:1;
    padding:calc(env(safe-area-inset-top) + 22px) 18px 100px 18px;
    overflow-y:auto;
  }
  h1,h2,h3{margin:0; font-weight:700; letter-spacing:-0.02em;}
  h2{font-size:26px; margin-bottom:4px;}
  .brand{
    font-size:22px;
    letter-spacing:-0.02em;
    font-weight:800;
    color:var(--ink);
    margin-bottom:2px;
  }
  .brand span{color:var(--accent);}
  .subhead{
    font-size:13.5px;
    color:var(--muted);
    margin-bottom:24px;
  }
  .stat-num{
    font-weight:700;
    letter-spacing:-0.02em;
    font-variant-numeric: tabular-nums;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 4px 14px rgba(0,0,0,0.22);
  }
  .card-title{
    font-size:13px;
    color:var(--muted);
    margin-bottom:12px;
    font-weight:600;
  }
  .hero-num{
    font-size:42px;
    line-height:1;
  }
  .hero-row{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .unit{
    font-size:14px;
    color:var(--muted);
    font-weight:600;
  }
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .grid3{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
  }
  input[type=number], input[type=text], input[type=date], select, textarea{
    width:100%;
    padding:12px 13px;
    border:1px solid var(--line);
    border-radius:11px;
    font-size:16px;
    background:var(--paper);
    color:var(--ink);
    font-family:inherit;
  }
  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--muted-dark);
  }
  label.field-label{
    font-size:12px;
    color:var(--muted);
    font-weight:600;
    display:block;
    margin-bottom:6px;
    margin-top:12px;
  }
  label.field-label:first-child{margin-top:0;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
  }
  .btn{
    background:var(--ink);
    color:var(--paper);
    padding:14px 18px;
    border-radius:13px;
    font-size:15px;
    font-weight:600;
    width:100%;
  }
  .btn:active{opacity:0.75;}
  .btn.accent{background:var(--accent); color:#fff;}
  .btn.ghost{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line);
  }
  .btn.sm{padding:9px 14px; font-size:13px; width:auto;}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{flex:1;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    padding:9px 15px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--paper);
    font-size:13.5px;
    font-weight:600;
    color:var(--muted-dark);
  }
  .chip.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  .list-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 0;
    border-bottom:1px solid var(--line);
    font-size:14.5px;
  }
  .list-row:last-child{border-bottom:none;}
  .list-row .meta{color:var(--muted); font-size:12.5px;}
  .bar-track{
    height:8px;
    background:var(--paper-dim);
    border-radius:6px;
    overflow:hidden;
    margin-top:6px;
  }
  .bar-fill{
    height:100%;
    background:var(--ink);
    border-radius:6px;
    transition:width .25s ease;
  }
  .macro-row{margin-bottom:14px;}
  .macro-row:last-child{margin-bottom:0;}
  .macro-label{
    display:flex;
    justify-content:space-between;
    font-size:12.5px;
    color:var(--muted);
    font-weight:600;
  }
  nav.tabbar{
    position:fixed;
    bottom:0;
    left:0; right:0;
    max-width:520px;
    margin:0 auto;
    background:rgba(15,16,18,0.86);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 4px calc(env(safe-area-inset-bottom) + 8px) 4px;
    z-index:50;
  }
  nav.tabbar button{
    flex:1;
    background:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:6px 2px;
    color:var(--muted);
    font-size:10.5px;
    font-weight:600;
  }
  nav.tabbar button.active{color:var(--accent);}
  nav.tabbar .ic{line-height:1; display:flex;}
  nav.tabbar svg{width:22px; height:22px;}
  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(23,24,26,0.5);
    z-index:100;
    display:flex;
    align-items:flex-end;
    max-width:520px;
    margin:0 auto;
  }
  .modal{
    background:var(--paper);
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    border-radius:22px 22px 0 0;
    padding:22px 18px calc(env(safe-area-inset-bottom) + 20px) 18px;
  }
  .modal-handle{
    width:36px; height:4px; background:var(--line); border-radius:3px;
    margin:0 auto 16px auto;
  }
  .close-x{
    position:absolute; top:16px; right:16px;
    font-size:15px; color:var(--muted-dark);
    background:var(--paper-dim);
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .toast{
    position:fixed;
    top:calc(env(safe-area-inset-top) + 14px);
    left:50%; transform:translateX(-50%);
    background:var(--ink);
    color:var(--paper);
    padding:11px 18px;
    border-radius:11px;
    font-size:13.5px;
    font-weight:600;
    max-width:88%;
    z-index:200;
    box-shadow:0 8px 24px rgba(0,0,0,0.22);
  }
  .profile-pick-btn{
    width:100%;
    text-align:left;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px;
    font-size:16px;
    font-weight:600;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.22);
  }
  .profile-pick-btn:active{opacity:0.8;}
  .segmented{
    display:flex;
    background:var(--paper-dim);
    border-radius:11px;
    padding:3px;
    gap:2px;
    margin-bottom:14px;
  }
  .segmented button{
    flex:1;
    padding:8px 4px;
    border-radius:9px;
    font-size:12.5px;
    font-weight:600;
    color:var(--muted-dark);
    background:transparent;
  }
  .segmented button.active{background:var(--card); color:var(--ink);}
  .empty{
    text-align:center;
    padding:30px 10px;
    color:var(--muted);
    font-size:13.5px;
  }
  .divider{height:1px; background:var(--line); margin:16px 0;}
  .food-lib-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 0; border-bottom:1px solid var(--line);
  }
  .food-lib-row:last-child{border-bottom:none;}
  .food-lib-row button{
    background:var(--paper-dim); color:var(--ink);
    border-radius:9px; padding:6px 13px; font-size:12.5px; font-weight:600;
  }
  .link-btn{
    background:none; color:var(--accent); font-weight:600; font-size:13.5px; padding:6px 0;
  }
  .spinner{
    display:inline-block; width:16px; height:16px;
    border:2px solid rgba(255,255,255,0.3);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    vertical-align:middle; margin-right:8px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .scan-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; padding:20px 8px;
    background:var(--card); border:1px solid var(--line);
    border-radius:16px; font-size:12.5px; font-weight:600; color:var(--muted-dark);
    box-shadow:0 1px 2px rgba(23,24,26,0.03);
  }
  .scan-btn svg{width:22px; height:22px; color:var(--ink);}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- icons ---------------- */
function svgIcon(name){
  const icons = {
    today: '<path d="M7 3v3M17 3v3M4 9h16M5 6h14a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"/>',
    weight: '<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 5V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1"/><circle cx="12" cy="13" r="3.2"/><path d="M12 13l1.6-1.6"/>',
    train: '<path d="M4 9v6M20 9v6M2 11v2M22 11v2M7 8v8M17 8v8M7 12h10"/>',
    food: '<path d="M6 3v7a2 2 0 0 0 2 2v9M6 3v9M9 3v9M14 3c-2 2-2 5-2 7 0 1.5 1 2 2 2v9M14 3v18"/>',
    trends: '<path d="M4 19h16M4 15l5-5 4 3 6-7"/><circle cx="4" cy="15" r="1.3" fill="currentColor" stroke="none"/><circle cx="9" cy="10" r="1.3" fill="currentColor" stroke="none"/><circle cx="13" cy="13" r="1.3" fill="currentColor" stroke="none"/><circle cx="19" cy="6" r="1.3" fill="currentColor" stroke="none"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 13.5c.1-.5.1-1 0-1.5l1.9-1.5-2-3.4-2.3.9a7.7 7.7 0 0 0-1.3-.75L15.3 5h-4l-.4 2.25c-.47.2-.9.45-1.3.75l-2.3-.9-2 3.4L7.2 12c-.1.5-.1 1 0 1.5l-1.9 1.5 2 3.4 2.3-.9c.4.3.83.55 1.3.75L11.3 20h4l.4-2.25c.47-.2.9-.45 1.3-.75l2.3.9 2-3.4-1.9-1.5z"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    camera: '<path d="M4 8h3l1.5-2.5h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>',
    barcode: '<path d="M4 5v14M8 5v14M11 5v14M13 5v14M17 5v14M20 5v14"/>'
  };
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${icons[name]||''}</svg>`;
}

/* ---------------- global error safety net ---------------- */
function errText(e){
  if(!e) return 'Unknown error';
  if(e.message) return e.message;
  if(typeof e === 'object'){
    try{ return JSON.stringify(e); }catch(_){ return String(e); }
  }
  return String(e);
}
function showFatalError(prefix, e){
  const banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#9C4A3C;color:#fff;padding:12px 16px;font-size:12px;font-family:monospace;z-index:9999;max-height:45vh;overflow:auto;white-space:pre-wrap';
  banner.textContent = prefix + ': ' + errText(e);
  document.body.appendChild(banner);
}
window.addEventListener('error', function(e){
  showFatalError('Script error', e.error || e.message || e);
});
window.addEventListener('unhandledrejection', function(e){
  showFatalError('Unhandled error', e.reason);
});

/* ---------------- supabase setup ---------------- */
const SUPABASE_URL = 'https://nvitvoccddmunmfzacgd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_qTF5oSAIbEhUAvVWgG7Ayw_JvHbLAqL';
let supabaseClient;
try{
  if(!window.supabase) throw new Error('Supabase library failed to load (check your internet connection and reload).');
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}catch(e){
  document.getElementById('app').innerHTML =
    '<div style="padding:40px 20px;font-family:sans-serif;color:#F3F1EB;background:#0F1012;min-height:100vh">'
    +'<h2>Couldn\'t start the app</h2><p>'+errText(e)+'</p>'
    +'<p style="color:#8A887F;font-size:13px">Try reloading the page. If this keeps happening, check that your connection is online.</p></div>';
  throw e;
}

/* ---------------- db data layer ---------------- */
async function dbEnsureProfiles(){
  for(const p of PROFILES){
    await supabaseClient.from('profiles').upsert({name:p.name}, {onConflict:'name'});
    const {data} = await supabaseClient.from('settings').select('profile_name').eq('profile_name', p.name).maybeSingle();
    if(!data){
      await supabaseClient.from('settings').insert({profile_name:p.name, ...DEFAULT_SETTINGS_DB});
    }
  }
}
async function dbFetchSettings(name){
  const {data, error} = await supabaseClient.from('settings').select('*').eq('profile_name', name).maybeSingle();
  if(error || !data) return null;
  return {
    calorieTarget: data.calorie_target,
    proteinTarget: data.protein_target,
    carbTarget: data.carb_target,
    fatTarget: data.fat_target,
    weightUnit: data.weight_unit,
    categories: data.categories,
  };
}
async function dbSaveSettings(name, s){
  await supabaseClient.from('settings').update({
    calorie_target: s.calorieTarget,
    protein_target: s.proteinTarget,
    carb_target: s.carbTarget,
    fat_target: s.fatTarget,
    weight_unit: s.weightUnit,
    categories: s.categories,
  }).eq('profile_name', name);
}
async function dbFetchWeightLog(name){
  const {data, error} = await supabaseClient.from('weight_logs').select('date,value').eq('profile_name', name).order('date');
  return error ? [] : data;
}
async function dbUpsertWeight(name, date, value){
  await supabaseClient.from('weight_logs').upsert({profile_name:name, date, value}, {onConflict:'profile_name,date'});
}
async function dbFetchWorkoutLog(name){
  const {data, error} = await supabaseClient.from('workout_logs').select('id,date,category,note').eq('profile_name', name).order('date');
  return error ? [] : data;
}
async function dbInsertWorkout(name, date, category, note){
  const {data, error} = await supabaseClient.from('workout_logs').insert({profile_name:name, date, category, note}).select().single();
  return error ? null : data;
}
async function dbDeleteWorkout(id){
  await supabaseClient.from('workout_logs').delete().eq('id', id);
}
async function dbFetchFoodLog(name){
  const {data, error} = await supabaseClient.from('food_items').select('*').eq('profile_name', name).order('date');
  if(error) return [];
  const byDate = {};
  data.forEach(row=>{
    if(!byDate[row.date]) byDate[row.date] = {date:row.date, items:[]};
    byDate[row.date].items.push({
      id:row.id, name:row.name, calories:row.calories, protein:row.protein,
      carbs:row.carbs, fat:row.fat, servingSize:row.serving_size, servingUnit:row.serving_unit
    });
  });
  return Object.values(byDate).sort((a,b)=>a.date.localeCompare(b.date));
}
async function dbInsertFoodItem(name, date, item){
  const {data, error} = await supabaseClient.from('food_items').insert({
    profile_name:name, date, name:item.name, calories:item.calories,
    protein:item.protein, carbs:item.carbs, fat:item.fat,
    serving_size:item.servingSize, serving_unit:item.servingUnit
  }).select().single();
  return error ? null : data;
}
async function dbDeleteFoodItem(id){
  await supabaseClient.from('food_items').delete().eq('id', id);
}
async function dbUpdateFoodItem(id, item){
  await supabaseClient.from('food_items').update({
    name:item.name, calories:item.calories, protein:item.protein,
    carbs:item.carbs, fat:item.fat, serving_size:item.servingSize, serving_unit:item.servingUnit
  }).eq('id', id);
}
async function dbFetchFoodLib(name){
  const {data, error} = await supabaseClient.from('food_library').select('*').eq('profile_name', name).order('created_at', {ascending:false});
  if(error) return [];
  return data.map(r=>({
    id:r.id, name:r.name, servingSize:r.serving_size, servingUnit:r.serving_unit,
    calories:r.calories, protein:r.protein, carbs:r.carbs, fat:r.fat
  }));
}
async function dbAddToLibrary(name, food){
  await supabaseClient.from('food_library').insert({
    profile_name:name, name:food.name, serving_size:food.servingSize, serving_unit:food.servingUnit,
    calories:food.calories, protein:food.protein, carbs:food.carbs, fat:food.fat
  });
}
async function dbDeleteFromLibrary(id){
  await supabaseClient.from('food_library').delete().eq('id', id);
}

const DEFAULT_SETTINGS_DB = {
  calorie_target:2200, protein_target:150, carb_target:220, fat_target:70,
  weight_unit:'kg', categories:['Push','Pull','Legs','Shoulder/Arms','Rest','Cardio']
};

const PROFILES = [
  {name:'Nidal', avatar:'boy'},
  {name:'Sajjar', avatar:'girl'},
];

/* ---------------- global state ---------------- */
let STATE = {
  view: 'loading', // loading, pick, today, weight, workouts, food, trends, settings
  activeProfile: null,
  settings: null,
  weightLog: [],
  workoutLog: [],
  foodLog: [],
  foodLib: [],
  weightRange: 30,
  foodLibOpen: false,
  foodDate: null,
  modal: null, // {type:'addWeight'|'addWorkout'|'addFood'|'foodConfirm'|'switchProfile', data:{}}
  toast: null,
  busy: false,
};

const DEFAULT_SETTINGS = {
  calorieTarget: 2200,
  proteinTarget: 150,
  carbTarget: 220,
  fatTarget: 70,
  weightUnit: 'kg',
  categories: ['Push','Pull','Legs','Shoulder/Arms','Rest','Cardio']
};

function todayStr(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}
function fmtDate(s){
  const d = new Date(s+'T00:00:00');
  return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
}
function addDays(dateStr, delta){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  dt.setUTCDate(dt.getUTCDate()+delta);
  return dt.toISOString().slice(0,10);
}
function renderMacroBar(label, val, target, unitLbl){
  const pct = target>0 ? Math.min(100, Math.round((val/target)*100)) : 0;
  const fill = label==='Calories' ? 'var(--accent)' : 'var(--ink)';
  return `<div class="macro-row">
    <div class="macro-label"><span>${label}</span><span>${Math.round(val)} / ${target} ${unitLbl}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${fill}"></div></div>
  </div>`;
}
function showToast(msg){
  STATE.toast = msg;
  render();
  setTimeout(()=>{ STATE.toast = null; render(); }, 2400);
}
function uid(){ return Math.random().toString(36).slice(2,10); }

/* ---------------- profile / bootstrap ---------------- */
async function boot(){
  STATE.view = 'loading';
  render();
  await dbEnsureProfiles();
  STATE.view = 'pick';
  render();
}

async function selectProfile(name){
  STATE.activeProfile = name;
  STATE.view = 'loading';
  render();
  const [settings, weightLog, workoutLog, foodLog, foodLib] = await Promise.all([
    dbFetchSettings(name),
    dbFetchWeightLog(name),
    dbFetchWorkoutLog(name),
    dbFetchFoodLog(name),
    dbFetchFoodLib(name),
  ]);
  STATE.settings = settings || {...DEFAULT_SETTINGS};
  STATE.weightLog = weightLog || [];
  STATE.workoutLog = workoutLog || [];
  STATE.foodLog = foodLog || [];
  STATE.foodLib = foodLib || [];
  STATE.foodDate = todayStr();
  STATE.view = 'today';
  render();
}

function switchProfile(){
  STATE.view = 'pick';
  STATE.activeProfile = null;
  render();
}

/* ---------------- data accessors ---------------- */
function foodDayEntry(date){
  return STATE.foodLog.find(d=>d.date===date);
}
function foodDayTotals(date){
  const day = foodDayEntry(date);
  if(!day) return {calories:0,protein:0,carbs:0,fat:0};
  return day.items.reduce((acc,it)=>({
    calories: acc.calories + (it.calories||0),
    protein: acc.protein + (it.protein||0),
    carbs: acc.carbs + (it.carbs||0),
    fat: acc.fat + (it.fat||0),
  }), {calories:0,protein:0,carbs:0,fat:0});
}
function workoutsForDate(date){
  return STATE.workoutLog.filter(w=>w.date===date);
}
function weightForDate(date){
  return STATE.weightLog.find(w=>w.date===date);
}

/* ---------------- mutations ---------------- */
async function saveWeight(date, value){
  const idx = STATE.weightLog.findIndex(w=>w.date===date);
  if(idx>-1) STATE.weightLog[idx].value = value;
  else STATE.weightLog.push({date, value});
  STATE.weightLog.sort((a,b)=>a.date.localeCompare(b.date));
  await dbUpsertWeight(STATE.activeProfile, date, value);
}
async function addWorkout(date, category, note){
  const saved = await dbInsertWorkout(STATE.activeProfile, date, category, note);
  const entry = saved ? {id:saved.id, date:saved.date, category:saved.category, note:saved.note} : {id:uid(), date, category, note};
  STATE.workoutLog.push(entry);
  STATE.workoutLog.sort((a,b)=>a.date.localeCompare(b.date));
}
async function removeWorkout(id){
  STATE.workoutLog = STATE.workoutLog.filter(w=>w.id!==id);
  await dbDeleteWorkout(id);
}
async function addFoodEntry(date, item){
  const saved = await dbInsertFoodItem(STATE.activeProfile, date, item);
  const finalItem = saved ? {
    id:saved.id, name:saved.name, calories:saved.calories, protein:saved.protein,
    carbs:saved.carbs, fat:saved.fat, servingSize:saved.serving_size, servingUnit:saved.serving_unit
  } : item;
  let day = foodDayEntry(date);
  if(!day){ day = {date, items:[]}; STATE.foodLog.push(day); }
  day.items.push(finalItem);
  STATE.foodLog.sort((a,b)=>a.date.localeCompare(b.date));
}
async function removeFoodEntry(date, itemId){
  const day = foodDayEntry(date);
  if(day) day.items = day.items.filter(it=>it.id!==itemId);
  await dbDeleteFoodItem(itemId);
}
async function editFoodEntry(date, itemId, item){
  const day = foodDayEntry(date);
  if(day){
    const idx = day.items.findIndex(it=>it.id===itemId);
    if(idx>-1) day.items[idx] = {...day.items[idx], ...item};
  }
  await dbUpdateFoodItem(itemId, item);
}
async function addToLibrary(food){
  food.id = food.id || uid();
  STATE.foodLib.unshift(food);
  await dbAddToLibrary(STATE.activeProfile, food);
}
async function removeFromLibrary(id){
  STATE.foodLib = STATE.foodLib.filter(f=>f.id!==id);
  await dbDeleteFromLibrary(id);
}
async function saveSettings(newSettings){
  STATE.settings = {...STATE.settings, ...newSettings};
  await dbSaveSettings(STATE.activeProfile, STATE.settings);
}

/* ---------------- barcode lookup ---------------- */
async function lookupBarcode(code){
  const resp = await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json');
  const data = await resp.json();
  if(!data || data.status !== 1 || !data.product) return {found:false};
  const p = data.product;
  const n = p.nutriments || {};
  let servingSize = null, servingUnit = 'g';
  if(p.serving_size){
    const m = String(p.serving_size).match(/([\d.]+)\s*([a-zA-Z]+)?/);
    if(m){ servingSize = parseFloat(m[1]); if(m[2]) servingUnit = m[2]; }
  }
  let calories, protein, carbs, fat;
  if(n['energy-kcal_serving'] != null){
    calories = n['energy-kcal_serving'];
    protein = n['proteins_serving'];
    carbs = n['carbohydrates_serving'];
    fat = n['fat_serving'];
  } else {
    servingSize = 100; servingUnit = 'g';
    calories = n['energy-kcal_100g'];
    protein = n['proteins_100g'];
    carbs = n['carbohydrates_100g'];
    fat = n['fat_100g'];
  }
  return {
    found:true,
    name: p.product_name || p.generic_name || 'Scanned product',
    servingSize: servingSize || 100,
    servingUnit: servingUnit || 'g',
    calories: calories!=null ? Math.round(calories) : null,
    protein: protein!=null ? Math.round(protein) : null,
    carbs: carbs!=null ? Math.round(carbs) : null,
    fat: fat!=null ? Math.round(fat) : null,
  };
}

function drawWeightChart(){
  const canvas = document.getElementById('weightChart');
  if(!canvas || STATE.weightLog.length<1) return;
  let logs = [...STATE.weightLog].sort((a,b)=>a.date.localeCompare(b.date));
  if(STATE.weightRange>0){
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate()-STATE.weightRange);
    const cutoffStr = cutoff.toISOString().slice(0,10);
    logs = logs.filter(l=>l.date>=cutoffStr);
  }
  const labels = logs.map(l=>fmtDate(l.date));
  const values = logs.map(l=>l.value);
  const trend = values.map((v,i)=>{
    const start = Math.max(0,i-6);
    const slice = values.slice(start,i+1);
    return slice.reduce((a,b)=>a+b,0)/slice.length;
  });
  if(window.__wchart) window.__wchart.destroy();
  window.__wchart = new Chart(canvas.getContext('2d'), {
    type:'line',
    data:{ labels, datasets:[
      {label:'Weight', data:values, borderColor:'#4A6FA5', backgroundColor:'transparent', pointRadius:3, tension:0.25, borderWidth:2},
      {label:'7-day avg', data:trend, borderColor:'#C9C5BB', backgroundColor:'transparent', pointRadius:0, borderWidth:2, borderDash:[5,4], tension:0.3}
    ]},
    options:{
      responsive:true,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:'#8A887F', font:{size:10}}, grid:{display:false}},
        y:{ticks:{color:'#8A887F', font:{size:10}}, grid:{color:'#232427'}}
      }
    }
  });
}

      <input type="hidden" id="f-base-fat" value="${baseFat===''?0:baseFat}">
      <input type="hidden" id="f-mode" value="${mode}">
      <input type="hidden" id="f-entryid" value="${d.entryId||''}">
      <div class="btn-row" style="margin-top:16px">
        ${mode==='edit' ? `
          <button class="btn ghost" id="f-delete" style="color:var(--muted-dark)">Delete</button>
          <button class="btn accent" id="f-save-edit">Save changes</button>
        ` : mode==='quickadd' ? `
          <button class="btn accent" id="f-save-once" style="width:100%">Log this</button>
        ` : `
          <button class="btn ghost" id="f-save-once">Log only</button>
          <button class="btn accent" id="f-save-lib">Log + save food</button>
        `}
      </div>
      ${d.sourceNote ? `<div class="subhead" style="margin-top:10px; margin-bottom:0">${d.sourceNote}</div>` : ''}
    `;
  } else if(m.type==='scanBarcode'){
    body = `
      <div class="subhead" style="margin-bottom:14px">Point your camera at the barcode.</div>
      <div id="qr-reader" style="width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:220px"></div>
      <div id="scan-status" class="subhead" style="margin-top:12px; margin-bottom:0"></div>
    `;
  }
  return `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal" style="position:relative">
        <div class="close-x" id="modal-close">✕</div>
        <div class="modal-handle"></div>
        ${body}
      </div>
    </div>
  `;
}

/* ---------------- event binding ---------------- */
function bindEvents(){
  // profile pick
  document.querySelectorAll('[data-pick]').forEach(el=>{
    el.onclick = ()=> selectProfile(el.dataset.pick);
  });

  // nav
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{ STATE.view = el.dataset.nav; STATE.modal=null; render(); };
  });

  // today quick actions
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = ()=>{ STATE.modal = {type:el.dataset.open}; render(); };
  });
  document.querySelectorAll('[data-quickworkout]').forEach(el=>{
    el.onclick = async ()=>{
      const cat = el.dataset.quickworkout;
      const existing = workoutsForDate(todayStr()).find(w=>w.category===cat);
      if(existing){
        await removeWorkout(existing.id);
        showToast('Removed '+cat);
      } else {
        await addWorkout(todayStr(), cat, '');
        showToast('Logged '+cat);
      }
      render();
    };
  });
  document.querySelectorAll('[data-removeworkout]').forEach(el=>{
    el.onclick = async ()=>{ await removeWorkout(el.dataset.removeworkout); render(); };
  });

  // weight range
  document.querySelectorAll('[data-range]').forEach(el=>{
    el.onclick = ()=>{ STATE.weightRange = Number(el.dataset.range); render(); };
  });

  // settings
  const saveSet = document.getElementById('save-settings');
  if(saveSet) saveSet.onclick = async ()=>{
    await saveSettings({
      calorieTarget: Number(document.getElementById('set-cal').value)||0,
      proteinTarget: Number(document.getElementById('set-pro').value)||0,
      carbTarget: Number(document.getElementById('set-carb').value)||0,
      fatTarget: Number(document.getElementById('set-fat').value)||0,
    });
    showToast('Targets saved');
    render();
  };
  document.querySelectorAll('[data-unit]').forEach(el=>{
    el.onclick = async ()=>{ await saveSettings({weightUnit:el.dataset.unit}); render(); };
  });
  const addCat = document.getElementById('add-cat');
  if(addCat) addCat.onclick = async ()=>{
    const val = document.getElementById('new-cat').value.trim();
    if(!val) return;
    const cats = [...STATE.settings.categories, val];
    await saveSettings({categories:cats});
    render();
  };
  const switchBtn = document.getElementById('switch-profile-btn');
  if(switchBtn) switchBtn.onclick = switchProfile;

  // food list removal
  document.querySelectorAll('[data-removefood]').forEach(el=>{
    el.onclick = async ()=>{ await removeFoodEntry(STATE.foodDate, el.dataset.removefood); render(); };
  });
  // tap a logged item to edit it
  document.querySelectorAll('[data-editfood]').forEach(el=>{
    el.onclick = ()=>{
      const day = foodDayEntry(STATE.foodDate);
      const it = day ? day.items.find(x=>x.id===el.dataset.editfood) : null;
      if(!it) return;
      STATE.modal = {type:'addFood', data:{
        mode:'edit', entryId: it.id,
        name: it.name, calories: it.calories, protein: it.protein,
        carbs: it.carbs, fat: it.fat,
        servingSize: it.servingSize, servingUnit: it.servingUnit
      }};
      render();
    };
  });
  // food date navigation
  document.querySelectorAll('[data-fooddate-delta]').forEach(el=>{
    el.onclick = ()=>{
      const delta = Number(el.dataset.fooddateDelta);
      const next = addDays(STATE.foodDate, delta);
      if(next > todayStr()) return;
      STATE.foodDate = next;
      render();
    };
  });
  document.querySelectorAll('[data-gotofooddate]').forEach(el=>{
    el.onclick = ()=>{ STATE.foodDate = el.dataset.gotofooddate; render(); };
  });
  const historyToggle = document.getElementById('foodhistory-toggle');
  if(historyToggle) historyToggle.onclick = ()=>{ STATE.foodHistoryOpen = !STATE.foodHistoryOpen; render(); };
  // quick add from library — opens editable modal prefilled, doesn't log instantly
  document.querySelectorAll('[data-quickfoodedit]').forEach(el=>{
    el.onclick = ()=>{
      const f = STATE.foodLib.find(x=>x.id===el.dataset.quickfoodedit);
      if(!f) return;
      STATE.modal = {type:'addFood', data:{
        mode:'quickadd',
        name: f.name, servingSize: f.servingSize, servingUnit: f.servingUnit,
        calories: f.calories, protein: f.protein, carbs: f.carbs, fat: f.fat
      }};
      render();
    };
  });
  document.querySelectorAll('[data-deletelibfood]').forEach(el=>{
    el.onclick = async (e)=>{
      e.stopPropagation();
      await removeFromLibrary(el.dataset.deletelibfood);
      showToast('Removed from saved foods');
      render();
    };
  });
  const libToggle = document.getElementById('foodlib-toggle');
  if(libToggle) libToggle.onclick = ()=>{ STATE.foodLibOpen = !STATE.foodLibOpen; render(); };

  // modal close
  const closeX = document.getElementById('modal-close');
  const backdrop = document.getElementById('modal-backdrop');
  if(closeX) closeX.onclick = ()=>{ stopScanner(); STATE.modal=null; render(); };
  if(backdrop) backdrop.onclick = (e)=>{ if(e.target===backdrop){ stopScanner(); STATE.modal=null; render(); } };

  // add weight modal
  const mSaveWeight = document.getElementById('m-save-weight');
  if(mSaveWeight) mSaveWeight.onclick = async ()=>{
    const val = Number(document.getElementById('m-weight').value);
    if(!val) { showToast('Enter a weight'); return; }
    await saveWeight(todayStr(), val);
    STATE.modal=null;
    showToast('Weight logged');
    render();
  };

  // add workout modal
  document.querySelectorAll('.modal-cat').forEach(el=>{
    el.onclick = ()=>{
      document.getElementById('m-cat-selected').value = el.dataset.cat;
      document.querySelectorAll('.modal-cat').forEach(c=>c.classList.remove('active'));
      el.classList.add('active');
    };
  });
  const mSaveWorkout = document.getElementById('m-save-workout');
  if(mSaveWorkout) mSaveWorkout.onclick = async ()=>{
    const cat = document.getElementById('m-cat-selected').value;
    if(!cat){ showToast('Pick a category'); return; }
    const note = document.getElementById('m-workout-note').value;
    const date = document.getElementById('m-workout-date').value || todayStr();
    await addWorkout(date, cat, note);
    STATE.modal=null;
    showToast('Session logged');
    render();
  };

  // add/edit food modal — "Amount" scales per-serving nutrition; "Servings" multiplies the total
  const fServingInput = document.getElementById('f-serving');
  const fServingsCountInput = document.getElementById('f-servings');
  function updateTotalPreview(){
    const calEl = document.getElementById('f-cal');
    const proEl = document.getElementById('f-pro');
    const carbEl = document.getElementById('f-carb');
    const fatEl = document.getElementById('f-fat');
    const el = document.getElementById('f-total-preview');
    if(!calEl || !proEl || !carbEl || !fatEl || !fServingsCountInput || !el) return;
    const cal = Number(calEl.value) || 0;
    const pro = Number(proEl.value) || 0;
    const carb = Number(carbEl.value) || 0;
    const fat = Number(fatEl.value) || 0;
    const servings = Number(fServingsCountInput.value) || 1;
    el.textContent = `Total for ${servings} serving${servings!==1?'s':''}: ${Math.round(cal*servings)} kcal · ${Math.round(pro*servings*10)/10}p · ${Math.round(carb*servings*10)/10}c · ${Math.round(fat*servings*10)/10}f`;
  }
  if(fServingInput) fServingInput.oninput = ()=>{
    const baseServing = Number(document.getElementById('f-base-serving').value) || 0;
    const baseCal = Number(document.getElementById('f-base-cal').value) || 0;
    const basePro = Number(document.getElementById('f-base-pro').value) || 0;
    const baseCarb = Number(document.getElementById('f-base-carb').value) || 0;
    const baseFat = Number(document.getElementById('f-base-fat').value) || 0;
    const newServing = Number(fServingInput.value) || 0;
    if(baseServing>0){
      const ratio = newServing/baseServing;
      document.getElementById('f-cal').value = Math.round(baseCal*ratio);
      document.getElementById('f-pro').value = Math.round(basePro*ratio*10)/10;
      document.getElementById('f-carb').value = Math.round(baseCarb*ratio*10)/10;
      document.getElementById('f-fat').value = Math.round(baseFat*ratio*10)/10;
    }
    updateTotalPreview();
  };
  if(fServingsCountInput) fServingsCountInput.oninput = updateTotalPreview;
  ['f-cal','f-pro','f-carb','f-fat'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', updateTotalPreview);
  });
  if(fServingInput && fServingsCountInput) updateTotalPreview();

  function readFoodForm(){
    const servings = Number(document.getElementById('f-servings').value) || 1;
    const perServingCal = Number(document.getElementById('f-cal').value)||0;
    const perServingPro = Number(document.getElementById('f-pro').value)||0;
    const perServingCarb = Number(document.getElementById('f-carb').value)||0;
    const perServingFat = Number(document.getElementById('f-fat').value)||0;
    return {
      name: document.getElementById('f-name').value.trim() || 'Food',
      servingSize: Number(document.getElementById('f-serving').value)||0,
      servingUnit: document.getElementById('f-servingunit').value,
      servings,
      perServingCal, perServingPro, perServingCarb, perServingFat,
      totalCal: perServingCal*servings,
      totalPro: perServingPro*servings,
      totalCarb: perServingCarb*servings,
      totalFat: perServingFat*servings,
    };
  }
  const fSaveOnce = document.getElementById('f-save-once');
  if(fSaveOnce) fSaveOnce.onclick = async ()=>{
    const f = readFoodForm();
    await addFoodEntry(STATE.foodDate, {
      id:uid(), name:f.name,
      calories:f.totalCal, protein:f.totalPro, carbs:f.totalCarb, fat:f.totalFat,
      servingSize:f.servingSize*f.servings, servingUnit:f.servingUnit
    });
    STATE.modal=null;
    showToast('Logged '+f.name);
    render();
  };
  const fSaveLib = document.getElementById('f-save-lib');
  if(fSaveLib) fSaveLib.onclick = async ()=>{
    const f = readFoodForm();
    await addFoodEntry(STATE.foodDate, {
      id:uid(), name:f.name,
      calories:f.totalCal, protein:f.totalPro, carbs:f.totalCarb, fat:f.totalFat,
      servingSize:f.servingSize*f.servings, servingUnit:f.servingUnit
    });
    await addToLibrary({
      name:f.name, servingSize:f.servingSize, servingUnit:f.servingUnit,
      calories:f.perServingCal, protein:f.perServingPro, carbs:f.perServingCarb, fat:f.perServingFat
    });
    STATE.modal=null;
    showToast('Logged and saved '+f.name);
    render();
  };
  const fSaveEdit = document.getElementById('f-save-edit');
  if(fSaveEdit) fSaveEdit.onclick = async ()=>{
    const f = readFoodForm();
    const entryId = document.getElementById('f-entryid').value;
    await editFoodEntry(STATE.foodDate, entryId, {
      name:f.name, calories:f.totalCal, protein:f.totalPro, carbs:f.totalCarb, fat:f.totalFat,
      servingSize:f.servingSize*f.servings, servingUnit:f.servingUnit
    });
    STATE.modal=null;
    showToast('Updated '+f.name);
    render();
  };
  const fDelete = document.getElementById('f-delete');
  if(fDelete) fDelete.onclick = async ()=>{
    const entryId = document.getElementById('f-entryid').value;
    await removeFoodEntry(STATE.foodDate, entryId);
    STATE.modal=null;
    showToast('Removed');
    render();
  };

  // live barcode scanner
  if(STATE.modal && STATE.modal.type==='scanBarcode'){
    startScanner();
  }
}

let __qrScanner = null;
function stopScanner(){
  if(__qrScanner){
    const s = __qrScanner;
    __qrScanner = null;
    s.stop().then(()=>s.clear()).catch(()=>{});
  }
}
function startScanner(){
  if(__qrScanner) return;
  const readerEl = document.getElementById('qr-reader');
  if(!readerEl || typeof Html5Qrcode === 'undefined') return;
  const formats = [
    Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128
  ];
  const scanner = new Html5Qrcode('qr-reader', {formatsToSupport: formats, verbose:false});
  __qrScanner = scanner;
  scanner.start(
    {facingMode:'environment'},
    {fps:10, qrbox:{width:260, height:140}},
    async (decodedText)=>{
      stopScanner();
      const statusEl = document.getElementById('scan-status');
      if(statusEl) statusEl.textContent = 'Found code '+decodedText+' — looking it up…';
      try{
        const result = await lookupBarcode(decodedText);
        if(!result.found){
          STATE.modal = {type:'addFood', data:{sourceNote:'No match for barcode '+decodedText+' in the product database — enter details manually.'}};
        } else {
          STATE.modal = {type:'addFood', data:{...result, sourceNote:'Pulled from Open Food Facts for barcode '+decodedText+' — double check before saving.'}};
        }
      }catch(err){
        STATE.modal = {type:'addFood', data:{sourceNote:'Lookup failed — enter details manually.'}};
      }
      render();
    },
    ()=>{ /* ignore per-frame no-match noise */ }
  ).catch(err=>{
    const statusEl = document.getElementById('scan-status');
    if(statusEl) statusEl.textContent = 'Could not access the camera: '+errText(err);
    __qrScanner = null;
  });
}

boot().catch(e=>{
  document.getElementById('app').innerHTML =
    '<div style="padding:40px 20px;font-family:sans-serif;color:#F3F1EB;background:#0F1012;min-height:100vh">'
    +'<h2>Something went wrong loading your data</h2><p>'+errText(e)+'</p>'
    +'<p style="color:#8A887F;font-size:13px">Try reloading the page.</p></div>';
});
</script>
